name: sistem-jadwal-servis

x-application: &application
  image: sistem-jadwal-servis-app:development
  restart: unless-stopped
  volumes:
    - ./:/var/www/html
    - vendor_data:/var/www/html/vendor
  networks:
    - application

services:
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - vendor_data:/var/www/html/vendor:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - application

  app:
    <<: *application
    build:
      context: .
      target: development
    environment:
      CONTAINER_ROLE: app
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - '$$socket = @fsockopen("127.0.0.1", 9000); if (! $$socket) { exit(1); } fclose($$socket);'
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 45s

  queue:
    <<: *application
    environment:
      CONTAINER_ROLE: queue
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy

  scheduler:
    <<: *application
    environment:
      CONTAINER_ROLE: scheduler
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=50
      - --mysqlx=OFF
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-sistem_jadwal_servis}"
      MYSQL_USER: "${DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - application

  node:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["sh", "/var/www/html/docker/node/start-vite.sh"]
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      VITE_HMR_HOST: "${VITE_HMR_HOST:-localhost}"
      VITE_HMR_CLIENT_PORT: "${VITE_HMR_CLIENT_PORT:-5173}"
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - application

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    networks:
      - application

networks:
  application:
    driver: bridge

volumes:
  mysql_data:
  vendor_data:
  node_modules:
  mailpit_data:
